<div class="pc-shopping-product">
  <div class="pc-shopping-product-content">
    <img
      [ngSrc]=String(productData()?.image)
      width="48"
      height="48"
      class="pc-shopping-product-image"
      [alt]=productData()?.name
      onerror="this.src = './assets/product/default_placeholder.svg'"/>

    <div class="pc-shopping-product-title pg-ral-regular">
      {{productData()?.name}}
    </div>

    <div class="pc-shopping-product-price pg-mont-medium">
      Ksh. {{productData()?.price}}
    </div>
  </div>

  <div class="pc-shopping-product-actions">
    <div class="flex items-center gap-2">
      <button
        (click)="removeFromCart()"
        [disabled]="productQuantity() === 0"
        class="pg-secondary-btn pg-ral-regular flex justify-center items-center w-8 h-8 p-0 min-w-8"
        [class.opacity-50]="productQuantity() === 0">
        <mat-icon class="text-sm">remove</mat-icon>
      </button>

      <span class="pg-mont-medium text-lg min-w-8 text-center">{{productQuantity()}}</span>

      <button
        (click)="addToCart()"
        class="pg-primary-btn pg-ral-regular flex justify-center items-center w-8 h-8 p-0 min-w-8">
        <mat-icon class="text-sm">add</mat-icon>
      </button>
    </div>
  </div>
</div>
